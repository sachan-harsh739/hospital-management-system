<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Department Management - CityCare Hospital</title><link rel="stylesheet" href="../src/css/output.css"><style>body{font-family:"Trebuchet MS","Segoe UI",sans-serif;background:#fff;color:#20232a}.top{background:#a90e17;color:#fff;padding:10px 6%;display:flex;justify-content:space-between}.nav{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px #77101818}.logo{font-size:25px;font-weight:800}.logo span{color:#d91520}.nav a{margin-left:20px;font-weight:700}.hero{background:linear-gradient(110deg,#a90e17,#d91520);color:#fff;padding:28px 6%}.wrap{max-width:1150px;margin:22px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card,.panel{background:#fff;border-radius:12px;box-shadow:0 5px 22px #6410151c;padding:18px}.card strong{font-size:28px;color:#a90e17}.card p{color:#6c727c}.panel{margin-top:18px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3e8;border-radius:6px;padding:9px;font:inherit}.field textarea{height:42px;resize:vertical}.wide{grid-column:span 2}.buttons{margin-top:15px;display:flex;gap:10px}.primary,.secondary,.table-action{border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.primary{background:#d91520;color:#fff}.secondary{border:1px solid #dfe3e8;background:#fff}.message{margin-top:10px;font-size:13px}.error{color:#b10f18}.success{color:#087443}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #f0d7d8;white-space:nowrap}th{background:#fff4f4;color:#a90e17}.table-action{background:#fff0f0;color:#a90e17;margin-right:5px}.table-action.danger{background:#a90e17;color:#fff}.status{font-size:11px;padding:4px 7px;border-radius:10px;background:#eaf8ef;color:#087443}.status.inactive{background:#fff0f0;color:#a90e17}@media(max-width:800px){.form-grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 1}.nav nav{display:none}}@media(max-width:500px){.form-grid,.cards{grid-template-columns:1fr}.wide{grid-column:auto}.top{font-size:11px}}</style></head><body><div class="top"><span>CityCare Hospital</span><span>Internal Management</span></div><header class="nav"><a class="logo" href="../index.html">City<span>Care</span> HOSPITAL</a><nav><a href="./admin-dashboard.html">Dashboard</a><a href="./patient-management.html">Patients</a><a href="./doctor-management.html">Doctors</a></nav></header><section class="hero"><h1>Department Management</h1><p>Create and manage hospital departments.</p></section><main class="wrap"><section class="cards"><div class="card"><strong id="totalDepartments">-</strong><p>Total Departments</p></div><div class="card"><strong id="activeDepartments">-</strong><p>Active Departments</p></div></section><section class="panel"><h2>Add Department</h2><form id="departmentForm"><div class="form-grid"><div class="field"><label>Department Name</label><input name="name" required></div><div class="field"><label>Department Head</label><input name="headDoctor"></div><div class="field"><label>Contact Number</label><input name="contactNumber" maxlength="10"></div><div class="field"><label>Location</label><input name="location"></div><div class="field"><label>Status</label><select name="status" required><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="field wide"><label>Description</label><textarea name="description" required></textarea></div></div><div class="buttons"><button id="departmentSubmit" class="primary">Add Department</button><button id="departmentClear" class="secondary" type="button">Clear Form</button></div></form><p id="departmentMessage" class="message"></p></section><section class="panel"><input id="departmentSearch" placeholder="Search department, head or location" style="width:100%;border:1px solid #dfe3e8;border-radius:6px;padding:10px"><div class="table-wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Description</th><th>Head</th><th>Contact</th><th>Location</th><th>Status</th><th>Actions</th></tr></thead><tbody id="departmentRows"></tbody></table></div></section></main><script src="../src/js/department-management.js"></script></body></html>
