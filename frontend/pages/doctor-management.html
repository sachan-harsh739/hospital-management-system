<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Management - CityCare Hospital</title><link rel="stylesheet" href="../src/css/output.css"><style>body{font-family:"Trebuchet MS","Segoe UI",sans-serif;background:#fff;color:#20232a}.top{background:#a90e17;color:#fff;padding:10px 6%;display:flex;justify-content:space-between}.nav{padding:18px 6%;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 12px #77101818}.logo{font-size:25px;font-weight:800}.logo span{color:#d91520}.nav a{margin-left:20px;font-weight:700}.hero{background:linear-gradient(110deg,#a90e17,#d91520);color:#fff;padding:28px 6%}.wrap{max-width:1150px;margin:22px auto;padding:0 18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card,.panel{background:#fff;border-radius:12px;box-shadow:0 5px 22px #6410151c;padding:18px}.card strong{font-size:28px;color:#a90e17}.card p{color:#6c727c}.panel{margin-top:18px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #dfe3e8;border-radius:6px;padding:9px}.wide{grid-column:span 2}.buttons{margin-top:15px;display:flex;gap:10px}.primary,.secondary,.table-action{border:0;border-radius:6px;padding:9px 16px;font-weight:700;cursor:pointer}.primary{background:#d91520;color:#fff}.secondary{border:1px solid #dfe3e8;background:#fff}.message{margin-top:10px;font-size:13px}.error{color:#b10f18}.success{color:#087443}.table-wrap{overflow:auto;margin-top:15px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:10px;text-align:left;border-bottom:1px solid #f0d7d8;white-space:nowrap}th{background:#fff4f4;color:#a90e17}.table-action{background:#fff0f0;color:#a90e17;margin-right:5px}.table-action.danger{background:#a90e17;color:#fff}.status{font-size:11px;padding:4px 7px;border-radius:10px;background:#eaf8ef;color:#087443}.status.on_leave,.status.unavailable{background:#fff4e5;color:#a45a00}@media(max-width:800px){.form-grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 1}.cards{grid-template-columns:1fr 1fr}.nav nav{display:none}}@media(max-width:500px){.form-grid,.cards{grid-template-columns:1fr}.wide{grid-column:auto}.top{font-size:11px}}</style></head><body><div class="top"><span>CityCare Hospital</span><span>Internal Management</span></div><header class="nav"><a class="logo" href="../index.html">City<span>Care</span> HOSPITAL</a><nav><a href="./admin-dashboard.html">Dashboard</a><a href="./patient-management.html">Patients</a><a href="./department-management.html">Departments</a></nav></header><section class="hero"><h1>Doctor Management</h1><p>Create and manage hospital doctors.</p></section><main class="wrap"><section class="cards"><div class="card"><strong id="totalDoctors">-</strong><p>Total Doctors</p></div><div class="card"><strong id="activeDoctors">-</strong><p>Active Doctors</p></div><div class="card"><strong id="coveredDepartments">-</strong><p>Departments Covered</p></div></section><section class="panel"><h2>Add Doctor</h2><form id="doctorForm"><div class="form-grid"><div class="field"><label>Doctor Name</label><input name="name" required></div><div class="field"><label>Specialization</label><input name="specialization" required></div><div class="field"><label>Department</label><input name="department" required></div><div class="field"><label>Phone</label><input name="phone" maxlength="10" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Qualification</label><input name="qualification"></div><div class="field"><label>Experience (years)</label><input name="experience" type="number" min="0" step="0.5"></div><div class="field"><label>Status</label><select name="status"><option value="available">Available</option><option value="unavailable">Unavailable</option><option value="on_leave">On Leave</option></select></div></div><div class="buttons"><button id="doctorSubmit" class="primary">Add Doctor</button><button id="doctorClear" class="secondary" type="button">Clear Form</button></div></form><p id="doctorMessage" class="message"></p></section><section class="panel"><div class="search"><input id="doctorSearch" placeholder="Search name, specialization, department, phone or email"></div><div class="table-wrap"><table><thead><tr><th>Doctor ID</th><th>Name</th><th>Specialization</th><th>Department</th><th>Phone</th><th>Email</th><th>Experience</th><th>Status</th><th>Actions</th></tr></thead><tbody id="doctorRows"></tbody></table></div></section></main><script src="../src/js/doctor-management.js"></script></body></html>
