nagement.html">Appointments</a></nav></header><section class="hero"><h1 id="patientTitle">Patient Details</h1><p>Read-focused patient profile and appointment history. <a id="recordsLink" class="hero-link" href="#">View Medical Records ›</a></p></section><main class="wrap"><section class="panel"><h2>Patient Profile</h2><div id="profile" class="profile">Loading patient profile...</div></section><section class="panel"><h2>Appointment History <small>(<span id="upcomingCount">0</span> upcoming)</small></h2><div style="overflow:auto;margin-top:15px"><table><thead><tr><th>Date</th><th>Doctor</th><th>Department</th><th>Reason</th><th>Status</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script src="../src/js/patient-details.js"></script></body></html>
